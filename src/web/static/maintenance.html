<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="300">
  <title>メンテナンス中 | BOATRACE WEB</title>
  <style>
    :root { color-scheme: dark; --cyan: #20d9ff; --ink: #06111e; --panel: #0d1c2d; --line: #1e4c66; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #e9f7ff;
      font-family: "Yu Gothic", "Meiryo", sans-serif; background: radial-gradient(circle at 20% 15%, #0e3950 0, transparent 38%), var(--ink); }
    main { width: min(620px, 100%); padding: 42px; border: 1px solid var(--line); border-radius: 20px;
      background: linear-gradient(145deg, rgba(16, 38, 58, .96), rgba(7, 20, 34, .96)); box-shadow: 0 24px 70px #0008; }
    .brand { color: var(--cyan); font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 18px 0 12px; font-size: clamp(30px, 7vw, 48px); line-height: 1.15; }
    p { color: #b8cada; line-height: 1.9; }
    .time { display: inline-block; margin-top: 18px; padding: 10px 16px; border: 1px solid #218bb0; border-radius: 999px; color: #dff9ff; }
    small { display: block; margin-top: 24px; color: #7891a6; }
  </style>
</head>
<body>
  <main>
    <div class="brand">BOATRACE WEB</div>
    <h1>データ更新中です</h1>
    <p>安定した表示のため、レース情報・モーター履歴・事故情報を更新しています。終了後、この画面は自動で再読み込みされます。</p>
    <div class="time">毎日 04:00 - 07:00（日本時間）</div>
    <small>ご不便をおかけしますが、しばらくお待ちください。</small>
  </main>
</body>
</html>
