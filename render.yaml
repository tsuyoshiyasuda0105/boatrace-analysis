# Render Blueprint
# Render side is Supabase-direct only.
# Historical bulk backfill remains a local-PC workflow.
services:
  - type: web
    name: boatrace-web
    runtime: python
    plan: standard
    branch: main
    region: singapore
    autoDeploy: true
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install gunicorn
    startCommand: gunicorn -w 1 --worker-class gthread --threads 4 -b 0.0.0.0:$PORT --timeout 120 --graceful-timeout 30 --max-requests 1000 --max-requests-jitter 200 'src.web.app:create_app()'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_WEB_SECRET
        generateValue: true
      - key: BOATRACE_MEMBER_PASSWORD
        sync: false
      - key: BOATRACE_PRO_PASSWORD
        sync: false
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"

  - type: cron
    name: boatrace-program-bootstrap-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    # 23:00-09:59 JST = 14:00-23:59 and 00:00-00:59 UTC. The scheduler itself
    # performs the 23:30/00:10/06:30/07:30 milestones and late-source recovery.
    schedule: "*/5 0,14-23 * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/render_program_bootstrap_scheduler.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromService:
          type: cron
          name: boatrace-regular-cron
          envVarKey: DATABASE_URL
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_TASK_TRIGGER
        value: "render-program-bootstrap"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"

  - type: cron
    name: boatrace-odds-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    # 08:00-22:59 JST = 23:00-13:59 UTC
    schedule: "*/5 23,0-13 * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/odds_scheduler_render.py --no-jitter
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_HISTORY_DAYS
        value: "30"
      - key: BOATRACE_RENDER_DAYTIME_LITE
        value: "1"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"

  - type: cron
    name: boatrace-regular-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    # 08:00-22:59 JST = 23:00-13:59 UTC
    schedule: "*/5 23,0-13 * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/render_regular_scheduler.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_HISTORY_DAYS
        value: "30"
      - key: BOATRACE_RENDER_DAYTIME_LITE
        value: "1"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"

  - type: cron
    name: boatrace-race-detail-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    # 22:00-00:59 UTC = 07:00-09:59 JST. Retry every 15 minutes after the
    # 06:30 final source recovery; the script skips once the day succeeds.
    schedule: "*/15 0,22-23 * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/prewarm_race_detail_data.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromService:
          type: cron
          name: boatrace-regular-cron
          envVarKey: DATABASE_URL
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_TASK_TRIGGER
        value: "render-detail-prewarm"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"

  - type: cron
    name: boatrace-exhibition-detail-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    # 08:00-22:59 JST = 23:00-13:59 UTC
    schedule: "*/5 23,0-13 * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/refresh_race_detail_after_exhibition.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromService:
          type: cron
          name: boatrace-regular-cron
          envVarKey: DATABASE_URL
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_TASK_TRIGGER
        value: "render-exhibition-detail-refresh"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"

  - type: cron
    name: boatrace-accident-external-check-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    # 20:10 UTC = 05:10 JST. Verify external accident benchmark once daily
    # after the 04:00 JST race-detail preparation window.
    schedule: "10 20 * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/check_external_accident_snapshot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromService:
          type: cron
          name: boatrace-regular-cron
          envVarKey: DATABASE_URL
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"
