# Render Blueprint
# Render side is Supabase-direct only.
# Historical bulk backfill remains a local-PC workflow.
services:
  - type: web
    name: boatrace-web
    runtime: python
    plan: free
    branch: main
    region: singapore
    autoDeploy: true
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install gunicorn
    startCommand: gunicorn -w 1 --worker-class gthread --threads 4 -b 0.0.0.0:$PORT --timeout 120 --max-requests 200 --max-requests-jitter 50 'src.web.app:create_app()'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_WEB_SECRET
        generateValue: true
      - key: BOATRACE_MEMBER_PASSWORD
        sync: false
      - key: BOATRACE_PRO_PASSWORD
        sync: false
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"

  - type: cron
    name: boatrace-odds-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    schedule: "* * * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/odds_scheduler.py --no-jitter
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_HISTORY_DAYS
        value: "30"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"

  - type: cron
    name: boatrace-regular-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    schedule: "*/5 * * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/render_regular_scheduler.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_HISTORY_DAYS
        value: "30"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"

  - type: cron
    name: boatrace-race-detail-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    # 22:45 UTC = 07:45 JST. Finish the ~15 minute stable-data prewarm before
    # users start opening the morning race-detail pages.
    schedule: "45 22 * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/prewarm_race_detail_data.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromService:
          type: cron
          name: boatrace-regular-cron
          envVarKey: DATABASE_URL
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_TASK_TRIGGER
        value: "render-detail-prewarm"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"

  - type: cron
    name: boatrace-exhibition-detail-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    schedule: "*/2 * * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/refresh_race_detail_after_exhibition.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromService:
          type: cron
          name: boatrace-regular-cron
          envVarKey: DATABASE_URL
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_TASK_TRIGGER
        value: "render-exhibition-detail-refresh"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"
