# Render Blueprint
# Render side is Supabase-direct only.
# Historical bulk backfill remains a local-PC workflow.
services:
  - type: web
    name: boatrace-web
    runtime: python
    plan: standard
    branch: main
    region: singapore
    autoDeploy: true
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install gunicorn
    # 2026-08-24: worker 2 -> 1。worker ごとに独立した接続プールを持つため、
    # 2 つあると Supabase 側の接続枠を食い合い、片方だけが枯れる。実際に
    # pid 83 は正常 (pool_available=3) なのに pid 82 は pool_available=0 のまま
    # 復帰せず、同じレースがアクセスのたびに開けたり開けなかったりした。
    # 1 プロセスにすれば接続要求が半減し、その半々の壊れ方も構造的に消える。
    # ページのメモリキャッシュも 1 つに集約されるので当たりやすくなる。
    # --threads 4 -> 3 (2026-08-24)。1 リクエストの中で入れ子に接続を取る経路が
    # あるため、1 スレッドが同時に 2 本使いうる。4 スレッド x 2 = 8 本が上限 6 本
    # を超え、全スレッドが「1 本持って 2 本目を待つ」膠着に入った (pool_available=0 /
    # requests_waiting=6 のまま復帰しない)。3 x 2 = 6 なら必ず誰かが進める。
    # スレッドを増やすなら BOATRACE_DB_POOL_SIZE も 2 倍に、かつ接続予算 15 本に
    # 収まるかを tests/test_db_pool_warmth.py で検算すること。
    startCommand: gunicorn -w 1 --worker-class gthread --threads 3 -b 0.0.0.0:$PORT --timeout 120 --graceful-timeout 30 'src.web.app:create_app(cached_predictions_only=True)'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      # Supabase の pooler は session mode で **クライアント 15 本**が上限
      # (2026-08-24 の実エラー: "max clients reached in session mode -
      #  max clients are limited to pool_size: 15")。この 15 本を web と
      # cron 6 本で分け合う。web が 12 本まで開けると cron の取り分が消え、
      # 実際に 21:45 の odds cron が接続を拒否された。
      # 予算: web 1 プロセス x 6 + cron 6 = 12 (ローカル作業ぶんに 3 残す)。
      # この算数は tests/test_db_pool_warmth.py が render.yaml を読んで検算する。
      - key: BOATRACE_DB_POOL_SIZE
        value: "6"
      - key: BOATRACE_DB_POOL_MIN_SIZE
        value: "3"
      # BOATRACE_PROFILE_HTTP は 2026-08-24 に外した。「詳細が 16 秒かかる」の
      # 正体は接続の取得待ち (5 秒 x 回数) だと判明したため、全リクエストを
      # 計測し続ける理由がなくなった。必要になったら env で戻せる。
      - key: BOATRACE_WEB_SECRET
        generateValue: true
      - key: BOATRACE_MEMBER_PASSWORD
        sync: false
      - key: BOATRACE_PRO_PASSWORD
        sync: false
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"
    # Optional paid persistent disk sample for kachisuji search (not enabled):
    # disk:
    #   name: kachisuji-data
    #   mountPath: /data
    #   sizeGB: 1
    # KACHISUJI_DB=/data/kachisuji_slim.db
    # KACHISUJI_STRATEGY_DB=/data/kachisuji_strategies.db

  - type: cron
    name: boatrace-program-bootstrap-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    # 23:00-09:59 JST = 14:00-23:59 and 00:00-00:59 UTC. The scheduler itself
    # performs the 23:30/00:10/06:30/07:30 milestones and late-source recovery.
    schedule: "*/10 0,14-23 * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/render_program_bootstrap_scheduler.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromService:
          type: cron
          name: boatrace-regular-cron
          envVarKey: DATABASE_URL
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_TASK_TRIGGER
        value: "render-program-bootstrap"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"

  - type: cron
    name: boatrace-odds-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    # 08:00-22:59 JST = 23:00-13:59 UTC
    schedule: "*/5 23,0-13 * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/odds_scheduler_render.py --no-jitter
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_HISTORY_DAYS
        value: "30"
      - key: BOATRACE_RENDER_DAYTIME_LITE
        value: "1"
      - key: BOATRACE_TASK_TRIGGER
        value: "render-odds"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"

  - type: cron
    name: boatrace-regular-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    # 08:00-22:59 JST = 23:00-13:59 UTC
    schedule: "*/5 23,0-13 * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/render_regular_scheduler.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_HISTORY_DAYS
        value: "30"
      - key: BOATRACE_RENDER_DAYTIME_LITE
        value: "1"
      - key: BOATRACE_TASK_TRIGGER
        value: "render-cron"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"

  - type: cron
    name: boatrace-race-detail-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    # 19:00-21:59 UTC = 04:00-06:59 JST. Heavy phases run serially and resume
    # from the first incomplete phase every ten minutes.
    schedule: "*/10 19-21 * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/render_maintenance_scheduler.py --allow-recovery
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromService:
          type: cron
          name: boatrace-regular-cron
          envVarKey: DATABASE_URL
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_TASK_TRIGGER
        value: "render-maintenance"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"

  - type: cron
    name: boatrace-exhibition-detail-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    # 08:00-22:59 JST = 23:00-13:59 UTC
    schedule: "*/5 23,0-13 * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/refresh_race_detail_after_exhibition.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromService:
          type: cron
          name: boatrace-regular-cron
          envVarKey: DATABASE_URL
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_TASK_TRIGGER
        value: "render-exhibition-detail-refresh"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"

  - type: cron
    name: boatrace-accident-external-check-cron
    runtime: python
    plan: starter
    branch: main
    region: singapore
    autoDeploy: true
    # 21:50 UTC = 06:50 JST. Verify after the maintenance accident snapshot.
    schedule: "50 21 * * *"
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python scripts/check_external_accident_snapshot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromService:
          type: cron
          name: boatrace-regular-cron
          envVarKey: DATABASE_URL
      - key: BOATRACE_SUPABASE_ONLY
        value: "1"
      - key: BOATRACE_TASK_TRIGGER
        value: "render-accident-external-check"
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
      - key: BOATRACE_DB_LIMIT_MB
        value: "8192"
