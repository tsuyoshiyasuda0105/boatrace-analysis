# Render Blueprint (最小構成: Web サービスのみ)
# https://render.com/docs/blueprint-spec
#
# 使い方:
#   1. Render に GitHub アカウントを接続
#   2. New + → Blueprint → このリポジトリを選択
#   3. デプロイ時にダッシュボードで Environment Variables を入力:
#      - BOATRACE_MEMBER_PASSWORD  (会員ログイン用パスワード)
#      - BOATRACE_PRO_PASSWORD     (Pro プランパスワード)
#   4. デプロイ完了後、デプロイされたアプリのシェルから初回データ投入:
#        python scripts/init_db.py
#        python scripts/daily_collect.py
#
# 概算コスト: $7 (Starter) + $0.25 (1GB Disk) = 月 $7.25 (≈ ¥1,100)
#
# データ取得 / 学習を自動化したい場合は cron や worker を後から追加可能。
# (このファイル末尾のコメントアウト例を参照)
services:
  - type: web
    name: boatrace-web
    runtime: python
    plan: starter         # $7/mo: 常時稼働、512MB RAM
    branch: main
    region: singapore     # 日本に近い (oregon でも可)
    autoDeploy: true      # main への push で自動デプロイ
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install gunicorn
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT --timeout 120 'src.web.app:create_app()'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BOATRACE_DB_PATH
        value: /var/data/boatrace.db
      - key: BOATRACE_WEB_SECRET
        generateValue: true       # Render が長いランダム値を自動生成
      - key: BOATRACE_MEMBER_PASSWORD
        sync: false               # ダッシュボードで手動入力
      - key: BOATRACE_PRO_PASSWORD
        sync: false               # ダッシュボードで手動入力
      - key: BOATRACE_USER_AGENT
        value: "boatrace-analysis/0.8 (+https://github.com/tsuyoshiyasuda0105/boatrace-analysis)"
    disk:
      name: boatrace-data
      mountPath: /var/data        # SQLite DB + models_artifacts 永続化
      sizeGB: 1                   # $0.25/GB/mo

